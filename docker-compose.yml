services:
   rabbitmq:
    image: rabbitmq:3-management   
    ports:
      - "5672:5672"     
      - "15672:15672"  
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]   
      interval: 10s
      timeout: 5s
      retries: 5

   postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: orders_user       
      POSTGRES_PASSWORD: orders_pass    
      POSTGRES_DB: orders_db            
    ports:
      - "5432:5432"  
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"] 
      interval: 10s
      timeout: 5s
      retries: 5

  
   mock_api:
    build:
      context: .
      dockerfile: dockerfile.mockapi
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  
   consumer:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock_api:
        condition: service_healthy